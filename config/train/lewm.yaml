defaults:
  - _self_
  - launcher: local
  - data: pusht
  - model: lewm
  - reg: sliced_ot   # anti-collapse regularizer: sliced_ot (WEMReg, ATLAS) or sigreg (LeWM)

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
embed_dim: 192
history_size: ${oc.select:data.history_size,3}

trainer:
  max_epochs: 10          # fixed budget across all tasks; train to completion (cosine LR
                          # anneals to 0 at max_epochs — the low-LR tail is needed by L_ood).
                          # Do NOT early-stop: stopping before the anneal completes leaves LR
                          # high and degrades the OOD/OT terms.
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

num_preds: 1

loss:
  # loss.sigreg (the anti-collapse regularizer) comes from the `reg` config group:
  #   reg=sliced_ot -> WEMReg (ATLAS arms);  reg=sigreg -> SIGReg (LeWM arms).
  ood:
    weight: 0.0   # OOD-recovery weight mu; 0.0 = off (baseline), 0.1 = enabled

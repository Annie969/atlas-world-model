defaults:
  - _self_
  - launcher: local
  - data: pusht
  - model: lewm

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
embed_dim: 192
history_size: ${oc.select:data.history_size,3}

trainer:
  max_epochs: 10          # fixed budget across all tasks; train to completion (cosine LR
                          # anneals to 0 at max_epochs — the low-LR tail is needed by L_ood).
                          # Do NOT early-stop: stopping before the anneal completes leaves LR
                          # high and degrades the OOD/OT terms.
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

num_preds: 1

loss:
  sigreg:
    name: sliced_ot
    weight: 3.0
    kwargs:
      num_proj: 1024
  ood:
    weight: 0.0   # OOD-recovery term; 0.0 == baseline LeWM, >0 (e.g. 0.1) enables it
